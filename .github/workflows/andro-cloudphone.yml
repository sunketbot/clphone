name: AndroCloud Phone (Android 16 // Linux // 2026)
run-name: Android16 CloudPhone Linux // run ${{ github.run_number }}
'on':
  workflow_dispatch:
    inputs:
      ngrok_authtoken:
        description: Ngrok auth token (optional, backup tunnel ke liye)
        required: false
        default: ''
        type: string
permissions:
  contents: read
  statuses: write
concurrency:
  group: andro-cloud-lin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloudphone:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PLATFORM_REPO: Silence-X-Proton/cloudphone-platform
      ANDRO_IMG: system-images;android-36;google_apis_playstore;x86_64
      ENABLE_CF: '1'
      HAS_NGROK: ${{ inputs.ngrok_authtoken != '' || secrets.NGROK_AUTHTOKEN != '' }}
    steps:
    - name: 0/11 Preflight + KVM check
      run: "set -Eeuo pipefail\necho \"::notice::ANDRO CLOUD v2026.4.0 // REAL cloudphone-platform // Android 16 // Linux host\"\necho \"runner: $RUNNER_NAME | $(uname -m)\"\nRAM=\"$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)\"\nCORES=\"$(nproc)\"\necho \"RAM=${RAM}MB cores=$CORES\"\n{ echo \"RAMMB=$RAM\"; echo \"CORES=$CORES\"; } >> \"$GITHUB_ENV\"\nif [ ! -e /dev/kvm ]; then\n  echo \"::error::/dev/kvm NHI MILA - hosted runner pe KVM zaroori hai. PUBLIC repo use karo.\"\n  exit 1\nfi\nls -la /dev/kvm\nmkdir -p /tmp/andro/state"
    - name: 1/11 JDK 17 (sdkmanager ke liye)
      run: "set -Eeuo pipefail\nif command -v java >/dev/null 2>&1; then\n  JV=\"$(java -version 2>&1 | head -1)\"\n  echo \"java found: $JV\"\n  if printf '%s' \"$JV\" | grep -qE 'version \"(1[7-9]|2[0-9])'; then exit 0; fi\nfi\nSUDO=\"\"\nif [ \"$(id -u)\" != \"0\" ]; then SUDO=\"sudo\"; fi\n$SUDO apt-get update -qq || true\n$SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openjdk-17-jdk-headless > /tmp/jdk.log 2>&1 || {\n  echo \"::warning::apt jdk failed - temurin zip\"; tail -20 /tmp/jdk.log || true\n  curl -fsSL --retry 3 -o /tmp/jdk.tgz \"https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse\"\n  mkdir -p \"$HOME/jdk17\" && tar -xzf /tmp/jdk.tgz -C \"$HOME/jdk17\" --strip-components=1\n  echo \"JAVA_HOME=$HOME/jdk17\" >> \"$GITHUB_ENV\"; echo \"$HOME/jdk17/bin\" >> \"$GITHUB_PATH\"; exit 0\n}\nJH=\"$(dirname \"$(dirname \"$(readlink -f \"$(command -v java)\")\")\")\"\necho \"JAVA_HOME=$JH\" >> \"$GITHUB_ENV\"\njava -version"
    - name: 2/11 Node.js 22
      run: 'set -Eeuo pipefail

        if command -v node >/dev/null 2>&1; then echo "node already: $(node --version)"; exit 0; fi

        curl -fsSL --retry 3 -o /tmp/node.tar.xz "https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz"

        mkdir -p "$HOME/noded" && tar -xJf /tmp/node.tar.xz -C "$HOME/noded" --strip-components=1

        echo "$HOME/noded/bin" >> "$GITHUB_PATH"

        node --version'
    - name: 3/11 Android SDK + Android 16 image
      run: "set -Eeuo pipefail\nif [ ! -f /tmp/andro/sdk/cmdline-tools/latest/bin/sdkmanager ]; then\n  echo \"Downloading Android cmdline-tools...\"\n  curl -fsSL --retry 3 -o /tmp/andro/ct.zip \"https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip\"\n  mkdir -p /tmp/andro/sdk/cmdline-tools\n  unzip -q -o /tmp/andro/ct.zip -d /tmp/andro/sdktmp\n  mv /tmp/andro/sdktmp/cmdline-tools /tmp/andro/sdk/cmdline-tools/latest\nfi\nSDKM=\"/tmp/andro/sdk/cmdline-tools/latest/bin/sdkmanager\"\nyes | \"$SDKM\" --sdk_root=/tmp/andro/sdk --licenses > /dev/null 2>&1 || true\necho \"Installing platform-tools + emulator + Android 16 image (1.5-2GB, 2-6 min)...\"\n\"$SDKM\" --sdk_root=/tmp/andro/sdk \"platform-tools\" \"emulator\" \"$ANDRO_IMG\" || {\n  echo \"::warning::Playstore image failed - Google APIs variant\"\n  ALT=\"$(printf '%s' \"$ANDRO_IMG\" | sed 's/_playstore//')\"\n  \"$SDKM\" --sdk_root=/tmp/andro/sdk \"platform-tools\" \"emulator\" \"$ALT\"\n  echo \"ANDRO_IMG=$ALT\" >> \"$GITHUB_ENV\"\n}\n{ echo \"ANDROID_HOME=/tmp/andro/sdk\"; echo \"ANDROID_SDK_ROOT=/tmp/andro/sdk\"; } >> \"$GITHUB_ENV\"\necho \"/tmp/andro/sdk/platform-tools\" >> \"$GITHUB_PATH\"\necho \"/tmp/andro/sdk/emulator\" >> \"$GITHUB_PATH\"\n/tmp/andro/sdk/platform-tools/adb --version | head -1"
    - name: 4/11 KVM permissions
      run: 'set -Eeuo pipefail

        ls -la /dev/kvm

        SUDO=""

        if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi

        $SUDO chmod 666 /dev/kvm 2>/dev/null || $SUDO usermod -aG kvm "$USER" 2>/dev/null || true

        ls -la /dev/kvm

        echo "::notice::KVM ready"'
    - name: 5/11 AVD Create + Verify
      run: "set -Eeuo pipefail\nAVDM=\"/tmp/andro/sdk/cmdline-tools/latest/bin/avdmanager\"\nEMU=\"/tmp/andro/sdk/emulator/emulator\"\nexport ANDROID_AVD_HOME=\"$HOME/.android/avd\"\nexport ANDROID_USER_HOME=\"$HOME/.android\"\nexport ANDROID_PREFS_ROOT=\"$HOME/.android\"\nmkdir -p \"$ANDROID_AVD_HOME\"\n{ echo \"ANDROID_AVD_HOME=$ANDROID_AVD_HOME\"; echo \"ANDROID_USER_HOME=$ANDROID_USER_HOME\"; echo \"ANDROID_PREFS_ROOT=$ANDROID_PREFS_ROOT\"; } >> \"$GITHUB_ENV\"\njava -version 2>&1 | head -1 || true\n\"$AVDM\" --version 2>&1 | head -2 || true\necho \"=== emulator shared libs check ===\"\nMISSING_LIBS=\"$(ldd \"$EMU\" 2>/dev/null | grep 'not found' || true)\"\nif [ -n \"$MISSING_LIBS\" ]; then\n  echo \"missing emulator libs: $MISSING_LIBS\"\n  SUDO=\"\"; if [ \"$(id -u)\" != \"0\" ]; then SUDO=\"sudo\"; fi\n  $SUDO apt-get update -qq || true\n  $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libpulse0 libasound2t64 libnss3 libgl1 libx11-6 libxcursor1 libxrandr2 libxinerama1 libxi6 > /tmp/emu-libs.log 2>&1 || true\n  echo \"after install: $(ldd \"$EMU\" 2>/dev/null | grep 'not found' | head -5 || true)\"\nelse\n  echo \"emulator shared libs OK\"\nfi\necho \"=== adbkey pre-generate ===\"\nmkdir -p \"$HOME/.android\"\nif [ ! -f \"$HOME/.android/adbkey\" ]; then\n  ssh-keygen -t rsa -b 2048 -m PEM -f \"$HOME/.android/adbkey\" -N \"\" -q 2>/dev/null || true\nfi\necho \"ADB_VENDOR_KEYS=$HOME/.android/adbkey\" >> \"$GITHUB_ENV\"\necho \"=== avdmanager create avd ===\"\nAVAIL_MB=\"$(df -BM /home/runner/.android 2>/dev/null | tail -1 | awk '{print int($4)}' | tr -d 'M')\"\nif [ -z \"$AVAIL_MB\" ] || [ \"$AVAIL_MB\" -le 0 ]; then AVAIL_MB=\"$(df -BM / | tail -1 | awk '{print int($4)}' | tr -d 'M')\"; fi\nDATAMB=$(( AVAIL_MB * 60 / 100 ))\nif [ \"$DATAMB\" -lt 8192 ]; then DATAMB=8192; fi\nif [ \"$DATAMB\" -gt 61440 ]; then DATAMB=61440; fi\necho \"datasize: ${DATAMB}MB (sparse)\"\nif echo no | \"$AVDM\" create avd -n cloudphone -k \"$ANDRO_IMG\" --force > /tmp/andro/avd.log 2>&1; then\n  echo \"::notice::avdmode=avdmanager\"\nelse\n  echo \"::warning::avdmanager failed - HAND-CRAFTED fallback\"\n  tail -30 /tmp/andro/avd.log || true\nfi\nCFG=\"$ANDROID_AVD_HOME/cloudphone.avd/config.ini\"\nif [ ! -f \"$CFG\" ]; then\n  echo \"hand-crafted AVD fallback...\"\n  AVDDIR=\"$ANDROID_AVD_HOME/cloudphone.avd\"\n  mkdir -p \"$AVDDIR\"\n  IMGREL=\"$(echo \"$ANDRO_IMG\" | tr ';' '/')\"\n  if [ ! -f \"/tmp/andro/sdk/system-images/$IMGREL/kernel-ranchu\" ]; then\n    FOUND=\"$(find /tmp/andro/sdk/system-images -mindepth 4 -maxdepth 4 -type f -name kernel-ranchu 2>/dev/null | head -1 || true)\"\n    if [ -n \"$FOUND\" ]; then IMGREL=\"$(dirname \"$FOUND\" | sed 's#^/tmp/andro/sdk/system-images/##')\"; fi\n  fi\n  TAGID=\"$(printf '%s' \"$IMGREL\" | cut -d/ -f3)\"\n  { echo \"avd.ini.encoding=UTF-8\"; echo \"path=$AVDDIR\"; echo \"path.rel=avd/cloudphone.avd\"; } > \"$ANDROID_AVD_HOME/cloudphone.ini\"\n  { echo \"avd.ini.encoding=UTF-8\"; echo \"hw.cpu.arch=x86_64\"; echo \"abi.type=x86_64\"; echo \"hw.cpu.ncore=2\";\n    echo \"hw.ramSize=2048\"; echo \"image.sysdir.1=system-images/$IMGREL/\"; echo \"tag.id=$TAGID\";\n    echo \"image.androidVersion.api=36\"; echo \"hw.lcd.width=1080\"; echo \"hw.lcd.height=2400\";\n    echo \"hw.lcd.density=440\"; echo \"disk.dataPartition.size=${DATAMB}M\"; echo \"hw.keyboard=yes\";\n    echo \"hw.audioInput=yes\"; echo \"hw.audioOutput=yes\"; } > \"$CFG\"\n  echo \"::notice::avdmode=handcrafted\"\nfi\nif [ ! -f \"$CFG\" ]; then echo \"::error::AVD config missing\"; cat /tmp/andro/avd.log || true; exit 1; fi\nRAMT=\"$RAMMB\"; if [ \"$RAMT\" -gt 32768 ]; then RAMT=32768; fi\nRAMT=$(( RAMT - 2500 )); if [ \"$RAMT\" -lt 2048 ]; then RAMT=2048; fi\nCOREST=$(( CORES - 1 )); if [ \"$COREST\" -lt 2 ]; then COREST=2; fi\n{\n  echo \"hw.ramSize=$RAMT\"\n  echo \"disk.dataPartition.size=${DATAMB}M\"\n  echo \"hw.lcd.width=1080\"\n  echo \"hw.lcd.height=2400\"\n  echo \"hw.lcd.density=440\"\n  echo \"hw.cpu.ncore=$COREST\"\n  echo \"hw.keyboard=yes\"\n  echo \"hw.audioInput=yes\"\n  echo \"hw.audioOutput=yes\"\
        \n} >> \"$CFG\"\n{ echo \"PHONERAM=$RAMT\"; echo \"PHONECORES=$COREST\"; echo \"PHONE_RAM_MB=$RAMT\"; } >> \"$GITHUB_ENV\"\nINIFILE=\"$ANDROID_AVD_HOME/cloudphone.ini\"\nif [ ! -f \"$INIFILE\" ]; then\n  { echo \"avd.ini.encoding=UTF-8\"; echo \"path=$ANDROID_AVD_HOME/cloudphone.avd\"; echo \"path.rel=avd/cloudphone.avd\"; } > \"$INIFILE\"\nfi\nif ! grep -q '^image.sysdir.1=' \"$CFG\"; then echo \"::error::missing image.sysdir.1\"; cat \"$CFG\" || true; exit 1; fi\nSYSREL=\"$(grep '^image.sysdir.1=' \"$CFG\" | head -1 | cut -d= -f2)\"\nSYSABS=\"/tmp/andro/sdk/$SYSREL\"\necho \"kernel check: $SYSABS\"\nif [ ! -f \"$SYSABS/kernel-ranchu\" ]; then\n  echo \"::error::kernel-ranchu missing at $SYSABS\"\n  find /tmp/andro/sdk/system-images -name kernel-ranchu 2>/dev/null || true\n  exit 1\nfi\necho \"kernel-ranchu OK: $(du -h \"$SYSABS/kernel-ranchu\" | cut -f1)\"\n\"$EMU\" -list-avds 2>&1 | head -5 || true\necho \"final config:\"; cat \"$CFG\"\necho \"::notice::avd=verified (RAM=${RAMT}MB cores=${COREST} storage=${DATAMB}MB)\""
    - name: 6/11 Boot Android 16 (console 5556)
      run: "set -Eeuo pipefail\nADB=\"/tmp/andro/sdk/platform-tools/adb\"\nexport ADB_VENDOR_KEYS=\"${ADB_VENDOR_KEYS:-$HOME/.android/adbkey}\"\nif [ ! -f \"$HOME/.android/adbkey\" ]; then\n  ssh-keygen -t rsa -b 2048 -m PEM -f \"$HOME/.android/adbkey\" -N \"\" -q 2>/dev/null || true\nfi\nexport ANDROID_AVD_HOME=\"$HOME/.android/avd\"\n# ADB server on 15000 (adapter ke liye) + emulator console 5556 => serial emulator-5556\nexport ANDROID_ADB_SERVER_PORT=15000\nexport ADB_SERVER_SOCKET=tcp:127.0.0.1:15000\n\"$ADB\" kill-server > /dev/null 2>&1 || true\n# immortal nodaemon PEHLE - emulator isi server me register hota hai (ANDROID_ADB_SERVER_PORT=15000)\nif ! (exec 3<>/dev/tcp/127.0.0.1/15000) 2>/dev/null; then\n  nohup setsid \"$ADB\" -L tcp:15000 server nodaemon > /tmp/andro/adb.log 2>&1 < /dev/null &\n  echo $! > /tmp/andro/adb.pid\n  echo \"immortal adb nodaemon (boot): pid $(cat /tmp/andro/adb.pid)\"\nfi\nadbready=\"\"\nfor i in $(seq 1 20); do (exec 3<>/dev/tcp/127.0.0.1/15000) 2>/dev/null && { adbready=1; break; }; sleep 1; done\nif [ -z \"$adbready\" ]; then echo \"::error::adb nodaemon 15000 bind fail (boot)\"; cat /tmp/andro/adb.log || true; exit 1; fi\necho \"::notice::adb server 15000 listening (boot)\"\nnohup /tmp/andro/sdk/emulator/emulator -avd cloudphone -port 5556 -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-metrics > /tmp/andro/emu.log 2>&1 &\necho $! > /tmp/andro/emu.pid\necho \"emulator starting (console 5556 => serial emulator-5556, ADB server 15000)...\"\nok=\"\"\nfor i in $(seq 1 90); do\n  ST=\"$(\"$ADB\" -P 15000 -s emulator-5556 shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)\"\n  if [ \"$ST\" = \"1\" ]; then ok=1; break; fi\n  if ! kill -0 \"$(cat /tmp/andro/emu.pid)\" 2>/dev/null; then\n    echo \"::error::emulator died - logs:\"; tail -40 /tmp/andro/emu.log || true; exit 1\n  fi\n  if [ $((i % 9)) -eq 0 ]; then\n    echo \"boot wait: $((i * 20))s... (adb: $(\"$ADB\" -P 15000 devices 2>/dev/null | tail -n +2 | head -2 | tr '\\n' ' ' || true))\"\n  fi\n  sleep 20\ndone\nif [ -z \"$ok\" ]; then\n  echo \"::error::Android boot timeout (30 min)\"; \"$ADB\" -P 15000 devices || true; tail -40 /tmp/andro/emu.log || true; exit 1\nfi\necho \"::notice::Android 16 BOOTED (emulator-5556)\"\n\"$ADB\" -P 15000 -s emulator-5556 shell svc power stayon true || true\n\"$ADB\" -P 15000 -s emulator-5556 shell settings put global window_animation_scale 0.0 || true\n\"$ADB\" -P 15000 -s emulator-5556 shell settings put global transition_animation_scale 0.0 || true\n\"$ADB\" -P 15000 -s emulator-5556 shell settings put global animator_duration_scale 0.0 || true\n\"$ADB\" -P 15000 -s emulator-5556 shell settings put global stay_on_while_plugged_in 7 || true\n\"$ADB\" -P 15000 -s emulator-5556 shell settings put secure user_setup_complete 1 || true\n\"$ADB\" -P 15000 -s emulator-5556 shell settings put global device_provisioned 1 || true\n\"$ADB\" -P 15000 -s emulator-5556 shell settings put system screen_off_timeout 2147460000 || true\n\"$ADB\" -P 15000 devices"
      env:
        ANDROID_ADB_SERVER_PORT: '15000'
    - name: 7/11 Real cloudphone-platform checkout + build
      run: "set -Eeuo pipefail\nif [ -d platform ]; then rm -rf platform; fi\ngit clone --depth 1 \"https://github.com/${PLATFORM_REPO}.git\" platform\ncd platform\nnpm ci --ignore-scripts --no-audit --no-fund\nnpx esbuild client.js --bundle --format=esm --target=es2022 --minify --outfile=public/client.js\n# diagnostic: WS connect/close logging (temporary, runner clone only)\npython3 - <<'WSLOG'\nimport re as _re\ns = open('server.mjs').read()\nif \"[wslog] CONNECT\" not in s:\n    s = s.replace(\"wss.on('connection', (ws, session, phone, quality, scale, audio) => {\",\n                  \"wss.on('connection', (ws, session, phone, quality, scale, audio) => {\\n    console.log('[wslog] CONNECT phone=' + phone.id + ' role=' + session.role + ' clients=' + wss.clients.size + ' quality=' + quality + ' scale=' + scale + ' audio=' + audio);\", 1)\n    s = s.replace(\"ws.on('close', () => {\",\n                  \"ws.on('close', (code, reason) => { console.log('[wslog] CLOSE phone=' + phone.id + ' code=' + code + ' reason=' + String(reason).slice(0, 60));\", 1)\n    open('server.mjs','w').write(s)\n    print('server.mjs instrumented')\nWSLOG\necho \"client.js bundle: $(wc -c < public/client.js) bytes\"\nnode --test tests/application.test.mjs 2>&1 | tail -4 || true\nls -la public/"
    - name: 8/11 scrcpy-server + Cloudflare tunnel + REAL server
      run: "set -Eeuo pipefail\ncurl -fsSL --retry 3 -o /tmp/andro/scrcpy-server.jar \"https://github.com/Genymobile/scrcpy/releases/download/v3.3.3/scrcpy-server-v3.3.3\"\necho \"7e70323ba7f259649dd4acce97ac4fefbae8102b2c6d91e2e7be613fd5354be0  /tmp/andro/scrcpy-server.jar\" | sha256sum -c - || { echo \"::error::scrcpy-server checksum mismatch\"; exit 1; }\necho \"scrcpy-server v3.3.3 OK ($(du -h /tmp/andro/scrcpy-server.jar | cut -f1))\"\n# --- Cloudflare quick tunnel FIRST (server ko publicOrigin chahiye https wala) ---\nTARCH=\"amd64\"; case \"$(uname -m)\" in aarch64|arm64) TARCH=\"arm64\";; esac\ncurl -fsSL --retry 3 --max-time 180 -o /tmp/andro/cloudflared \"https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-$TARCH\" || {\n  curl -fsSL --retry 3 --max-time 180 -o /tmp/andro/cf.tgz \"https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-x86_64.tgz\" && tar -xzf /tmp/andro/cf.tgz -C /tmp/andro && chmod +x /tmp/andro/cloudflared\n}\nchmod +x /tmp/andro/cloudflared\nnohup /tmp/andro/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8790 > /tmp/andro/cf.log 2>&1 &\necho $! > /tmp/andro/cf.pid\nCF_URL=\"\"\nfor i in $(seq 1 45); do\n  CF_URL=\"$(grep -o 'https://[a-z0-9-]*\\.trycloudflare\\.com' /tmp/andro/cf.log | head -1 || true)\"\n  [ -n \"$CF_URL\" ] && break\n  sleep 2\ndone\nif [ -z \"$CF_URL\" ]; then echo \"::error::Cloudflare tunnel nahi aaya\"; tail -30 /tmp/andro/cf.log || true; exit 1; fi\necho \"CF_URL=$CF_URL\" >> \"$GITHUB_ENV\"\necho \"::notice::Tunnel UP: $CF_URL\"\n# --- ADB server ensure (15000) — boot-step daemon step-bound ho sakta hai, yahan khud start karo ---\nADB=\"/tmp/andro/sdk/platform-tools/adb\"\nexport ANDROID_ADB_SERVER_PORT=15000\nexport ADB_SERVER_SOCKET=tcp:127.0.0.1:15000\n# IMMORTAL adb daemon (repo pattern: -L tcp:PORT nodaemon)\nif ! (exec 3<>/dev/tcp/127.0.0.1/15000) 2>/dev/null; then\n  nohup setsid \"$ADB\" -L tcp:15000 server nodaemon > /tmp/andro/adb.log 2>&1 < /dev/null &\n  echo $! > /tmp/andro/adb.pid\n  echo \"adb nodaemon started (pid $(cat /tmp/andro/adb.pid))\"\nfi\nfor i in $(seq 1 10); do (exec 3<>/dev/tcp/127.0.0.1/15000) 2>/dev/null && break; sleep 1; done\nemu_ok=\"\"\nfor i in $(seq 1 30); do\n  if \"$ADB\" -P 15000 devices 2>/dev/null | grep -q \"emulator-5556[[:space:]]*device\"; then emu_ok=1; break; fi\n  sleep 1\ndone\necho \"ADB 15000 devices: $(\"$ADB\" -P 15000 devices 2>/dev/null | tail -n +2 | tr '\n' ' ')\"\nif [ -z \"$emu_ok\" ]; then\n  echo \"::error::emulator-5556 ADB server 15000 me register nahi hua (30s)\"\n  \"$ADB\" -P 15000 devices || true\n  tail -5 /tmp/andro/emu.log || true\n  exit 1\nfi\necho \"::notice::emulator-5556 registered on adb server 15000\"\n# --- REAL server (adapter + createApplication standalone) ---\ncat > platform/runner-adapter.mjs <<'ADAPTER_EOF'\n// Hosted-runner adapter: wires the REAL cloudphone-platform server to ONE emulator.\n// Implements the manager surface createApplication() needs: list/create/start/stop/delete/\n// usage/capabilities/verifyKey/revealKey/metrics. No broker, no cgroups - runner scope only.\nimport { createHash, randomBytes, timingSafeEqual } from 'node:crypto';\nimport { readFile, writeFile, mkdir } from 'node:fs/promises';\nimport path from 'node:path';\nimport { startDevice, mapResources } from './server.mjs';\n\nconst STATE = '/tmp/andro/state';\nconst phoneId = randomBytes(8).toString('hex'); // 16 hex chars, matches ID_RE\nconst KEY_RE = /^[A-Za-z0-9_-]{43}$/;\n\nfunction makeKey() { return randomBytes(32).toString('base64url'); } // exactly 43 chars\n\nconst record = {\n  schemaVersion: 1,\n  id: phoneId, name: 'cloudphone', status: 'running',\n  adbPort: 15000, consolePort: 5556, serial: 'emulator-5556',\n  accessKey: makeKey(), createdAt: new Date().toISOString(),\n  guestRamMiB: Number(process.env.PHONE_RAM_MB || 4096),\n  hostMemoryMiB: Number(process.env.PHONE_RAM_MB || 4096) + 1024,\n  diskGiB: 16,\n};\n\n// The emulator runs with ADB on 15000 (emulator -port 5556 -> adb 5556? no: console 5556, adb 5557)\n// Actually:\
        \ emulator -port N -> console N, adb N+1. Our AVD booted as emulator-5554 by default.\n// startDevice() in server.mjs uses state.phone.adbPort for AdbServerNodeTcpConnector host port.\n// Simplest correct mapping: emulator default emulator-5554 => console 5554, adb 5555 (tcp).\n// But validatePhoneIdentity requires serial === `emulator-${consolePort}` and consolePort in 5556..5616 even.\n// So we boot emulator with -ports 5556,5557: console 5556 (serial emulator-5556), ADB TCP port 5556? No.\n// ADB emulator serials are emulator-<consolePort>. The ADB server listens on 5037 and connects to\n// console port for TCP. AdbServerNodeTcpConnector({host:'127.0.0.1', port: adbPort}) connects to an\n// adbd TCP socket. Emulator adbd listens on consolePort+1 (5557) only when -ports used with tcp.\n// We launch: emulator -avd cloudphone -port 5556 => console 5556, adbd 5557 via 'emulator-5556' serial.\n// AdbServerClient with AdbServerNodeTcpConnector spawns adb server; it uses serial emulator-5556.\n// The connector port is the ADB SERVER port (5037), not device port. Wait - re-check:\n// AdbServerNodeTcpConnector({host, port}) connects to the adb *server* (default 5037).\n// server.mjs passes state.phone.adbPort as that port with the phone serial. So we run ONE adb server\n// on 15000 via adb -P 15000 start-server? The emulator registers with adb server 5037 by default.\n// Solution used here: run `adb start-server` on default 5037; adapter passes adbPort=5037? But\n// validatePhoneIdentity enforces adbPort 15000..15030. So: adb server on port 15000:\n//   ADB_SERVER_PORT=15000 adb start-server ; emulator also needs ADB_SERVER_PORT? Emulator auto-detects?\n// Emulator connects to adb server via ADB_SERVER_PORT env or default 5037. Setting env before launch\n// makes emulator register emulator-5556 into THAT server. Then connector port 15000 sees the device.\n// consolePort must satisfy: 5556..5616, even. emulator -port 5556 gives console 5556, serial emulator-5556. OK.\n\nconst adapter = {\n  async list() { return [{ ...record }]; },\n  async create() { throw new Error('Runner adapter: single pre-provisioned phone'); },\n  async start(id) { record.status = 'running'; return { ...record }; },\n  async stop(id) { record.status = 'stopped'; return { ...record }; },\n  async delete() { throw new Error('Runner adapter: delete disabled'); },\n  async usage() {\n    const mem = { memoryTotalBytes: 16 * 1024 ** 3, memoryAvailableBytes: 8 * 1024 ** 3 };\n    const disk = { diskTotalBytes: 100 * 1024 ** 3, diskAvailableBytes: 60 * 1024 ** 3 };\n    return { ...mem, ...disk, memoryReservedBytes: 0, memoryReserveBytes: 2 * 1024 ** 3,\n      diskCommittedBytes: 16 * 1024 ** 3, diskReserveBytes: 10 * 1024 ** 3,\n      memoryAllocatableBytes: 6 * 1024 ** 3, diskAllocatableBytes: 50 * 1024 ** 3, phoneCount: 1 };\n  },\n  async capabilities() { return { supported: true, checks: {} }; },\n  async verifyKey(id, candidate) {\n    if (id !== phoneId || typeof candidate !== 'string') return false;\n    const digest = v => createHash('sha256').update(v, 'utf8').digest();\n    return timingSafeEqual(digest(record.accessKey), digest(candidate));\n  },\n  async revealKey(id) {\n    if (id !== phoneId) throw new Error('unknown phone');\n    if (!KEY_RE.test(record.accessKey)) throw new Error('key unavailable');\n    return record.accessKey;\n  },\n  async metrics(id) { return { memoryBytes: record.guestRamMiB * 1024 ** 2, diskUsedBytes: 0 }; },\n};\n\nawait mkdir(STATE, { recursive: true });\nawait writeFile(path.join(STATE, 'record.json'), JSON.stringify(record, null, 2), { mode: 0o600 });\nconsole.log('[adapter] phone id:', phoneId);\n\n// Launch the REAL application (standalone mode = phone UI, key login) on 127.0.0.1:8790.\nconst { createApplication } = await import('./server.mjs');\n// Real repo credential format: schemaVersion 1, scrypt(N=16384,r=8,p=1,64-byte) — auth.mjs validates it.\nimport { scryptSync } from 'node:crypto';\nconst adminPassword = randomBytes(24).toString('base64url');\nconst salt = randomBytes(16).toString('hex');\nconst credentials\
        \ = {\n  schemaVersion: 1, username: 'admin', salt,\n  passwordHash: scryptSync(adminPassword, Buffer.from(salt, 'hex'), 64, { N: 16384, r: 8, p: 1 }).toString('hex'),\n};\nconst app = await createApplication({\n  manager: adapter, mode: 'standalone', port: 8790, host: '127.0.0.1',\n  publicOrigin: process.env.PUBLIC_ORIGIN, secureCookies: true,\n  scrcpyServer: process.env.SCRCPY_SERVER || '/tmp/andro/scrcpy-server.jar',\n  deviceStarter: async (state, send) => {\n    try {\n      console.log('[adapter] stream start: quality=%s serial=%s adbPort=%d', state.quality, state.phone.serial, state.phone.adbPort);\n      await startDevice(state, send);\n      console.log('[adapter] stream start OK (video metadata sent)');\n    } catch (error) {\n      console.error('[adapter] STREAM START FAIL:', error?.constructor?.name, '-', error?.message);\n      throw error;\n    }\n  },\n  credentials,\n});\napp.server.listen(8790, '127.0.0.1', () => console.log('[adapter] real cloudphone UI on 127.0.0.1:8790'));\n\n// Persist key + id + admin password for the workflow steps to publish.\nawait writeFile('/tmp/andro/state/access.json', JSON.stringify({\n  id: phoneId, key: record.accessKey, admin: adminPassword, url: process.env.PUBLIC_ORIGIN || '' }, null, 2));\nconsole.log('[adapter] access.json written (id + key + admin)');\n\nADAPTER_EOF\ncd platform\nexport ANDROID_ADB_SERVER_PORT=15000\nexport ADB_SERVER_SOCKET=tcp:127.0.0.1:15000\nexport SCRCPY_SERVER=/tmp/andro/scrcpy-server.jar\nexport PUBLIC_ORIGIN=\"$CF_URL\"\nexport PHONE_RAM_MB=\"$PHONERAM\"\nnohup node runner-adapter.mjs > /tmp/andro/server.log 2>&1 &\necho $! > /tmp/andro/server.pid\n# wait for access.json (phone id + key) + HTTP 200\nok=\"\"\nfor i in $(seq 1 60); do\n  if [ -f /tmp/andro/state/access.json ] && curl -s -o /dev/null --max-time 3 http://127.0.0.1:8790/; then ok=1; break; fi\n  if ! kill -0 \"$(cat /tmp/andro/server.pid)\" 2>/dev/null; then\n    echo \"::error::server died - logs:\"; tail -40 /tmp/andro/server.log || true; exit 1\n  fi\n  sleep 2\ndone\nif [ -z \"$ok\" ]; then echo \"::error::server readiness timeout\"; tail -40 /tmp/andro/server.log || true; exit 1; fi\necho \"--- server.log ---\"; tail -10 /tmp/andro/server.log\necho \"PHONE_ID=$(python3 -c \"import json;print(json.load(open('/tmp/andro/state/access.json'))['id'])\")\" >> \"$GITHUB_ENV\"\necho \"PHONE_KEY=$(python3 -c \"import json;print(json.load(open('/tmp/andro/state/access.json'))['key'])\")\" >> \"$GITHUB_ENV\"\necho \"ADMIN_PW=$(python3 -c \"import json;print(json.load(open('/tmp/andro/state/access.json'))['admin'])\")\" >> \"$GITHUB_ENV\"\necho \"::notice::REAL cloudphone UI UP on 127.0.0.1:8790 via $CF_URL\""
    - name: 9/11 ngrok backup (optional)
      if: env.HAS_NGROK == 'true'
      env:
        NGROK_SECRET: ${{ secrets.NGROK_AUTHTOKEN }}
        NGROK_INPUT: ${{ inputs.ngrok_authtoken }}
      run: "set -Eeuo pipefail\nNGROK_AUTHTOKEN=\"$NGROK_INPUT\"\nif [ -z \"$NGROK_AUTHTOKEN\" ]; then NGROK_AUTHTOKEN=\"$NGROK_SECRET\"; fi\nif [ -z \"$NGROK_AUTHTOKEN\" ]; then echo \"ngrok token missing - skip\"; exit 0; fi\ncurl -fsSL --retry 3 -o /tmp/andro/ngrok.zip \"https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-linux-amd64.zip\"\nmkdir -p /tmp/andro/ngrokbin && unzip -o /tmp/andro/ngrok.zip -d /tmp/andro/ngrokbin > /dev/null\nNGROK_BIN=\"/tmp/andro/ngrokbin/ngrok\"\n\"$NGROK_BIN\" config add-authtoken \"$NGROK_AUTHTOKEN\"\nnohup \"$NGROK_BIN\" http 8790 --log stdout > /tmp/andro/ngrok.log 2>&1 &\necho $! > /tmp/andro/ngrok.pid\nNGROK_URL=\"\"\nfor i in $(seq 1 30); do\n  NGROK_URL=\"$(curl -s --max-time 3 http://127.0.0.1:4040/api/tunnels | grep -o '\"public_url\":\"https://[^\"]*\"' | head -1 | cut -d'\"' -f4 || true)\"\n  [ -n \"$NGROK_URL\" ] && break\n  sleep 2\ndone\nif [ -n \"$NGROK_URL\" ]; then echo \"NGROK_URL=$NGROK_URL\" >> \"$GITHUB_ENV\"; echo \"::notice::ngrok UP: $NGROK_URL\"; else echo \"::warning::ngrok nahi aaya\"; fi"
    - name: 9.5/11 Stream self-test (real WS)
      run: "set -Eeuo pipefail\nexport ANDROID_ADB_SERVER_PORT=15000\nexport ADB_SERVER_SOCKET=tcp:127.0.0.1:15000\n# defensive: adb nodaemon zinda? nahi to restart\nADB=\"/tmp/andro/sdk/platform-tools/adb\"\nif ! (exec 3<>/dev/tcp/127.0.0.1/15000) 2>/dev/null; then\n  echo \"::warning::adb 15000 dead - nodaemon restart\"\n  nohup setsid \"$ADB\" -L tcp:15000 server nodaemon >> /tmp/andro/adb.log 2>&1 < /dev/null &\n  for i in $(seq 1 15); do (exec 3<>/dev/tcp/127.0.0.1/15000) 2>/dev/null && break; sleep 1; done\nfi\ncat > platform/streamtest.mjs <<'ST_EOF'\n// Real stream self-test: login with key, open WS, wait for video metadata or error.\nconst base = 'http://127.0.0.1:8790';\nconst access = JSON.parse(await (await import('node:fs/promises')).readFile('/tmp/andro/state/access.json', 'utf8'));\nconst login = await fetch(base + '/api/login', { method: 'POST',\n  headers: { 'Content-Type': 'application/json', 'Origin': access.url || 'https://example.com' },\n  body: JSON.stringify({ phoneId: access.id, key: access.key }) });\nif (!login.ok) { console.error('LOGIN FAIL ' + login.status); process.exit(2); }\nconst cookie = (login.headers.get('set-cookie') || '').split(';')[0];\nconst wsUrl = base.replace('http', 'ws') + '/stream?id=' + access.id + '&quality=economy&scale=0.5&audio=off';\nconst { WebSocket } = await import('ws');\nawait new Promise((resolve, reject) => {\n  const ws = new WebSocket(wsUrl, { headers: { Cookie: cookie, Origin: access.url || 'https://example.com' } });\n  const timer = setTimeout(() => { console.error('STREAM TIMEOUT (no metadata in 25s)'); ws.close(); resolve(3); }, 25000);\n  ws.on('open', () => console.log('WS OPEN'));\n  ws.on('message', (data, binary) => {\n    if (!binary) {\n      const msg = JSON.parse(data.toString());\n      console.log('MSG', JSON.stringify(msg).slice(0, 140));\n      if (msg.type === 'metadata') { console.log('STREAM OK — video metadata received'); clearTimeout(timer); ws.close(); resolve(0); }\n      if (msg.type === 'error') { console.error('STREAM ERROR from server:', msg.message); clearTimeout(timer); ws.close(); resolve(4); }\n    } else {\n      console.log('BIN', data.byteLength, 'bytes (H.264 data flowing)');\n      clearTimeout(timer); ws.close(); resolve(0);\n    }\n  });\n  ws.on('close', (code, reason) => { console.log('WS CLOSE', code, String(reason)); });\n  ws.on('error', (e) => { console.error('WS ERROR', e.message); clearTimeout(timer); reject(e); });\n}).then(code => { if (code === 0) process.exit(0); process.exit(code); });\nST_EOF\ncd platform\nCODE=0\nnode streamtest.mjs || CODE=$?\necho \"stream self-test exit: $CODE\"\nif [ \"$CODE\" = \"0\" ]; then echo \"::notice::STREAM SELF-TEST: PASS (H.264 metadata received)\"; else echo \"::warning::STREAM SELF-TEST: FAIL (code $CODE)\"; fi\n# reconnect race test: 2 aur connections 2s gap se (browser jaisa pattern)\nfor round in 2 3; do\n  sleep 2\n  RCODE=0\n  node streamtest.mjs || RCODE=$?\n  echo \"reconnect round $round exit: $RCODE\"\ndone\necho \"=== server.log (FULL diagnostic dump) ===\"\ntail -50 /tmp/andro/server.log || true\necho \"=== adb 15000 devices ===\"\n\"$ADB\" -P 15000 devices 2>/dev/null || true\nif [ \"$CODE\" != \"0\" ]; then\n  echo \"::warning::STREAM SELF-TEST FAIL — server.log dump (stream debug):\"\n  tail -60 /tmp/andro/server.log || true\n  echo \"=== ADB state ===\"\n  \"$ADB\" -P 15000 devices || true\n  echo \"=== process list ===\"\n  ps aux | grep -E \"emulator|node|cloudflared\" | grep -v grep | head -8 || true\n  echo \"::notice::Stream test fail hua par UI live hai — deployer aur summary se access milega\"\nfi"
    - name: 10/11 Publish URL + Access Key
      run: "set -Eeuo pipefail\nPRIMARY=\"${CF_URL}\"\n{\n  echo \"## ANDRO CLOUD — REAL cloudphone-platform LIVE\"\n  echo \"\"\n  echo \"**Phone URL:** $PRIMARY\"\n  echo \"\"\n  echo \"| Item | Value |\"\n  echo \"|---|---|\"\n  echo \"| Phone ID | \\`$PHONE_ID\\` |\"\n  echo \"| Access Key | \\`$PHONE_KEY\\` |\"\n  echo \"| Admin password (backup login) | \\`$ADMIN_PW\\` |\"\n  echo \"| Login | Phone access key (dropdown: 'Phone access key') |\"\n  echo \"| Android | $ANDRO_IMG |\"\n  echo \"| RAM / Cores | ${PHONERAM}MB / ${PHONECORES} |\"\n  echo \"| Stream | scrcpy 3.3.3 H.264 + Opus audio (asli platform protocol) |\"\n  echo \"| UI | Real cloudphone UI (dashboard/phone viewer, game mode, settings) |\"\n  echo \"\"\n  echo \"### Login kaise karein\"\n  echo \"1. URL kholo → 'Sign-in method' = **Phone access key**\"\n  echo \"2. Phone ID: \\`$PHONE_ID\\`\"\n  echo \"3. Access key: \\`$PHONE_KEY\\`\"\n  echo \"4. Connect → real Android 16 phone screen\"\n} >> \"$GITHUB_STEP_SUMMARY\"\necho \"::notice::PHONE LIVE -> $PRIMARY\"\necho \"::notice title=androv4::cf=$CF_URL\"\necho \"::notice title=androv4::phoneid=$PHONE_ID\"\necho \"::notice title=androv4::key=$PHONE_KEY\"\necho \"::notice title=androv4::admin=$ADMIN_PW\"\nif [ -n \"${NGROK_URL:-}\" ]; then echo \"::notice title=androv4::ng=$NGROK_URL\"; fi\necho \"=== commit-status channel (deployer instant access) ===\"\nST_API=\"https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}\"\n# description 140-char limit: sirf short marker. Creds target_url query params mein (deployer parse karta hai).\nST_TURL=\"${PRIMARY}#andro?phoneid=${PHONE_ID}&key=${PHONE_KEY}&admin=${ADMIN_PW}&run=${GITHUB_RUN_ID}\"\n[ -n \"${NGROK_URL:-}\" ] && ST_TURL=\"${ST_TURL}&ng=${NGROK_URL}\"\nST_DESC=\"LIVE cf=${PHONE_ID}\"\nST_BODY=\"$(printf '{\"state\":\"success\",\"context\":\"andro-live\",\"target_url\":\"%s\",\"description\":\"%s\"}' \\\n  \"${ST_TURL}\" \"${ST_DESC}\")\"\nST_CODE=000\nfor attempt in 1 2 3; do\n  ST_CODE=\"$(curl -s -o /tmp/andro/status.json -w '%{http_code}' -X POST \\\n    -H \"Authorization: token ${{ secrets.GITHUB_TOKEN }}\" \\\n    -H \"Accept: application/vnd.github+json\" \\\n    -d \"$ST_BODY\" \"$ST_API\" || true)\"\n  echo \"commit-status push (attempt $attempt): HTTP $ST_CODE\"\n  [ \"$ST_CODE\" = \"201\" ] && break\n  sleep 3\ndone\nif [ \"$ST_CODE\" != \"201\" ]; then\n  echo \"::warning::commit-status push fail — annotations notice channel fallback active\"\n  head -c 300 /tmp/andro/status.json 2>/dev/null || true\nfi\n# annotations channel: notice messages with title= plain format (check-runs annotations API se readable)\necho \"::notice::cf=$CF_URL\"\necho \"::notice::phoneid=$PHONE_ID\"\necho \"::notice::key=$PHONE_KEY\"\necho \"::notice::admin=$ADMIN_PW\"\nif [ -n \"${NGROK_URL:-}\" ]; then echo \"::notice::ng=$NGROK_URL\"; fi\necho \"::notice::PHONE LIVE -> $PRIMARY (login: Phone access key)\""
    - name: Failure Diagnostics (auto)
      if: failure()
      run: 'echo "=== EMULATOR LOG (tail 40) ==="; tail -40 /tmp/andro/emu.log 2>/dev/null || true

        echo "=== SERVER LOG ==="; tail -30 /tmp/andro/server.log 2>/dev/null || true

        echo "=== CF LOG ==="; tail -20 /tmp/andro/cf.log 2>/dev/null || true

        echo "=== ADB DEVICES ==="; /tmp/andro/sdk/platform-tools/adb -P 15000 devices 2>/dev/null || true

        echo "=== DISK ==="; df -h / | tail -1'
    - name: Keep Alive (auto-heal, ~5.5h hosted)
      run: "set -Eeuo pipefail\nADB=\"/tmp/andro/sdk/platform-tools/adb\"\nexport ANDROID_ADB_SERVER_PORT=15000\nexport ADB_SERVER_SOCKET=tcp:127.0.0.1:15000\ni=0\nwhile [ \"$i\" -lt 330 ]; do\n  i=$((i + 1))\n  if ! kill -0 \"$(cat /tmp/andro/emu.pid)\" 2>/dev/null; then\n    echo \"::warning::min $i: emulator down - restarting\"\n    nohup /tmp/andro/sdk/emulator/emulator -avd cloudphone -port 5556 -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-metrics >> /tmp/andro/emu.log 2>&1 &\n    echo $! > /tmp/andro/emu.pid\n    sleep 40\n  fi\n  # adb daemon immortal bana ke rakho (mar gaya to restart)\n  if ! (exec 3<>/dev/tcp/127.0.0.1/15000) 2>/dev/null; then\n    echo \"::warning::min $i: adb daemon down - restarting\"\n    nohup setsid /tmp/andro/sdk/platform-tools/adb -L tcp:15000 server nodaemon >> /tmp/andro/adb.log 2>&1 < /dev/null &\n    echo $! > /tmp/andro/adb.pid\n    sleep 3\n  fi\n  echo \"--- SRVLOG min $i (server.log tail) ---\"\n  tail -22 /tmp/andro/server.log 2>/dev/null || true\n  if ! curl -s -o /dev/null --max-time 5 http://127.0.0.1:8790/; then\n    echo \"::warning::min $i: server down - restarting\"\n    (cd platform && ANDROID_ADB_SERVER_PORT=15000 ADB_SERVER_SOCKET=tcp:127.0.0.1:15000 SCRCPY_SERVER=/tmp/andro/scrcpy-server.jar PUBLIC_ORIGIN=\"${CF_URL}\" PHONE_RAM_MB=\"$PHONERAM\" nohup node runner-adapter.mjs >> /tmp/andro/server.log 2>&1 &)\n    sleep 5\n  fi\n  if ! pgrep -f \"cloudflared tunnel\" > /dev/null 2>&1; then\n    echo \"::warning::min $i: cloudflared down - restarting (URL change ho sakta hai)\"\n    nohup /tmp/andro/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8790 >> /tmp/andro/cf.log 2>&1 &\n    sleep 10\n    NEWURL=\"$(grep -o 'https://[a-z0-9-]*\\.trycloudflare\\.com' /tmp/andro/cf.log | tail -1 || true)\"\n    if [ -n \"$NEWURL\" ] && [ \"$NEWURL\" != \"${CF_URL:-}\" ]; then\n      echo \"CF_URL=$NEWURL\" >> \"$GITHUB_ENV\"\n      echo \"::notice::NEW Cloudflare URL -> $NEWURL\"\n    fi\n  fi\n  if [ $((i % 30)) -eq 0 ]; then echo \"keep-alive: $i/330 min - phone + server + tunnel alive\"; fi\n  sleep 60\ndone"
